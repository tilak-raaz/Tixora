<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookMyTicket dev checkout</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: #8884;
        --accent: #3b6cf6;
      }
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        max-width: 760px;
        margin: 24px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 20px;
      }
      section {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 16px;
        margin: 12px 0;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      input,
      select,
      button {
        font: inherit;
        padding: 4px 8px;
        margin: 2px 4px 2px 0;
      }
      button.primary {
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 4px;
      }
      #seats button {
        width: 44px;
      }
      #seats button.picked {
        outline: 2px solid var(--accent);
      }
      pre {
        background: #8881;
        padding: 8px;
        overflow-x: auto;
        font-size: 12px;
        max-height: 260px;
      }
      .muted {
        opacity: 0.7;
      }
    </style>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <h1>BookMyTicket dev checkout</h1>
    <p class="muted">
      Development only. Pays in Razorpay <strong>test mode</strong> through the real API, the way
      the M6 frontend will.
    </p>

    <section>
      <h2>1. Account</h2>
      <input id="email" placeholder="email" value="dev-buyer@example.com" />
      <input id="password" type="password" placeholder="password" value="dev-buyer-password" />
      <button id="signup">Sign up</button>
      <button id="signin">Sign in</button>
      <span id="who" class="muted"></span>
    </section>

    <section>
      <h2>2. Show</h2>
      <select id="city"></select>
      <input id="date" type="date" />
      <button id="loadShows">Find shows</button>
      <select id="show"></select>
      <button id="loadSeats">Seat map</button>
    </section>

    <section>
      <h2>3. Seats</h2>
      <div id="seats" class="muted">Load a seat map first.</div>
      <p>
        <button id="hold" class="primary">Hold picked seats</button> <span id="holdInfo"></span>
      </p>
    </section>

    <section>
      <h2>4. Pay</h2>
      <button id="pay" class="primary">Pay with Razorpay</button>
      <button id="refresh">Refresh booking</button>
      <span id="status"></span>
    </section>

    <pre id="log"></pre>

    <script>
      const $ = (id) => document.getElementById(id);
      const state = { picked: new Set(), booking: null };

      function log(label, value) {
        const line = `${new Date().toLocaleTimeString()}  ${label}\n${JSON.stringify(value, null, 2)}\n`;
        $('log').textContent = line + $('log').textContent;
      }

      async function api(method, path, body, headers = {}) {
        const res = await fetch(path, {
          method,
          credentials: 'same-origin',
          headers: { 'content-type': 'application/json', ...headers },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        const json = await res.json().catch(() => ({}));
        log(`${method} ${path} → ${res.status}`, json);
        if (!res.ok) throw new Error(json.error?.message ?? res.statusText);
        return json;
      }

      async function whoAmI() {
        try {
          const { user } = await api('GET', '/api/v1/me');
          $('who').textContent = `signed in as ${user.email}`;
        } catch {
          $('who').textContent = 'not signed in';
        }
      }

      async function auth(kind) {
        const email = $('email').value;
        const password = $('password').value;
        const body =
          kind === 'sign-up' ? { name: 'Dev Buyer', email, password } : { email, password };
        await api('POST', `/api/auth/${kind}/email`, body).catch(() => undefined);
        await whoAmI();
      }

      async function loadCities() {
        const { cities } = await api('GET', '/api/v1/cities');
        $('city').innerHTML = cities
          .map((c) => `<option value="${c.slug}">${c.name}</option>`)
          .join('');
        $('date').valueAsDate = new Date();
      }

      async function loadShows() {
        const city = $('city').value;
        const date = $('date').value;
        const { movies } = await api('GET', `/api/v1/cities/${city}/movies?date=${date}`);
        const options = [];
        for (const movie of movies) {
          const { theatres } = await api(
            'GET',
            `/api/v1/movies/${movie.id}/shows?city=${city}&date=${date}`,
          );
          for (const t of theatres) {
            for (const s of t.shows) {
              const time = new Date(s.startsAt).toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
              });
              options.push(
                `<option value="${s.id}">${movie.title} · ${t.name} · ${time} (${s.availableSeats} free)</option>`,
              );
            }
          }
        }
        $('show').innerHTML =
          options.join('') || '<option value="">No shows (run make seed)</option>';
      }

      async function loadSeats() {
        state.picked.clear();
        const { seats } = await api('GET', `/api/v1/shows/${$('show').value}/seats`);
        const rows = new Map();
        for (const seat of seats) {
          if (!rows.has(seat.row)) rows.set(seat.row, []);
          rows.get(seat.row).push(seat);
        }
        $('seats').classList.remove('muted');
        $('seats').innerHTML = [...rows]
          .map(
            ([row, list]) =>
              `<div><strong>${row}</strong> ` +
              list
                .map(
                  (s) =>
                    `<button data-id="${s.id}" ${s.status === 'AVAILABLE' ? '' : 'disabled'} title="${s.category} ₹${s.pricePaise / 100}">${s.number}</button>`,
                )
                .join('') +
              '</div>',
          )
          .join('');
      }

      $('seats').addEventListener('click', (event) => {
        const id = event.target.dataset?.id;
        if (!id) return;
        if (state.picked.has(id)) state.picked.delete(id);
        else state.picked.add(id);
        event.target.classList.toggle('picked');
      });

      async function hold() {
        const { booking } = await api(
          'POST',
          '/api/v1/bookings',
          { showId: $('show').value, seatIds: [...state.picked] },
          { 'Idempotency-Key': crypto.randomUUID() },
        );
        state.booking = booking;
        $('holdInfo').textContent =
          `held ₹${booking.totalPaise / 100} until ${new Date(booking.expiresAt).toLocaleTimeString()}`;
      }

      async function refresh() {
        if (!state.booking) return;
        const { booking } = await api('GET', `/api/v1/bookings/${state.booking.id}`);
        $('status').textContent = `booking is ${booking.status}`;
        return booking.status;
      }

      async function pay() {
        if (!state.booking) throw new Error('Hold seats first');
        const bookingId = state.booking.id;
        const { order } = await api('POST', `/api/v1/bookings/${bookingId}/payment-order`);
        const checkout = new Razorpay({
          key: order.keyId,
          order_id: order.razorpayOrderId,
          amount: order.amountPaise,
          currency: order.currency,
          name: 'BookMyTicket (dev)',
          description: `Booking ${bookingId.slice(0, 8)}`,
          handler: async (result) => {
            // Only checks the signature; the webhook confirms the booking.
            await api('POST', `/api/v1/bookings/${bookingId}/payment/verify`, {
              razorpayOrderId: result.razorpay_order_id,
              razorpayPaymentId: result.razorpay_payment_id,
              razorpaySignature: result.razorpay_signature,
            });
            for (let i = 0; i < 15; i++) {
              if ((await refresh()) === 'CONFIRMED') return;
              await new Promise((r) => setTimeout(r, 2000));
            }
          },
        });
        checkout.on('payment.failed', (response) => log('payment failed', response.error));
        checkout.open();
      }

      const safe = (fn) => () => fn().catch((err) => log('error', err.message));
      $('signup').onclick = safe(() => auth('sign-up'));
      $('signin').onclick = safe(() => auth('sign-in'));
      $('loadShows').onclick = safe(loadShows);
      $('loadSeats').onclick = safe(loadSeats);
      $('hold').onclick = safe(hold);
      $('pay').onclick = safe(pay);
      $('refresh').onclick = safe(refresh);
      safe(loadCities)();
      safe(whoAmI)();
    </script>
  </body>
</html>
