# The single entry point of the local full stack (ADR 0014): spreads /api across the API replicas,
# sends everything else to the Next.js server, and keeps live seat streams unbuffered. The shared
# parts live in http.conf, routes.conf and internal.conf; production wraps the same ones in HTTPS
# (infra/deploy/nginx.conf.template).

worker_processes auto;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/bmt/http.conf;

  server {
    listen 8080;

    location = /nginx/health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    include /etc/nginx/bmt/routes.conf;
  }

  include /etc/nginx/bmt/internal.conf;
}
