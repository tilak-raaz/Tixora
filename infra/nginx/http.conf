# Shared by the local stack (nginx.conf) and production (infra/deploy/nginx.conf.template):
# everything inside `http {}` except the servers. ADR 0014 explains each choice.

include /etc/nginx/mime.types;
default_type application/octet-stream;
server_tokens off;
sendfile on;
tcp_nodelay on;
keepalive_timeout 65s;

# Docker's DNS. With `resolve` below, nginx follows the replicas as they stop, restart (with a
# new address) or scale, instead of keeping the addresses it saw at startup.
resolver 127.0.0.11 valid=5s ipv6=off;

# One JSON line per request. upstream = the replica that answered (and the ones tried before it).
log_format json escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","client":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr",'
  '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';
access_log /dev/stdout json;

upstream api {
  zone api 64k;
  # The replica with the fewest open connections gets the next request. Live seat streams stay
  # open for minutes; round-robin would ignore them and could pile them onto one replica.
  least_conn;
  # `api` resolves to every replica. A replica that fails 3 times is skipped for 10 s.
  server api:4000 resolve max_fails=3 fail_timeout=10s;
  keepalive 64;
}

upstream web {
  zone web 64k;
  server web:3000 resolve;
  keepalive 16;
}

# Who the client is, as the API sees it (it trusts exactly one proxy hop, the last entry):
# - the public edge (8080 locally, 80 and 443 in production): nginx's own view of the caller.
#   Anything the client sent is dropped, so nobody can pick their own rate-limit bucket.
# - port 8081, internal: requests from the Next.js server, which already put the visitor's
#   address there (apps/web/src/lib/server-api.ts). Only containers on this network reach it.
map $server_port $forwarded_for {
  8081 $http_x_forwarded_for;
  default $remote_addr;
}

# Inherited by every location below, as long as none sets proxy_set_header itself.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# The API logs this ID and echoes it back, so one request can be followed through both logs.
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 2s;
# When a replica cannot be reached, try another one. nginx never retries POST, PATCH or
# DELETE (they may have happened); holds also carry idempotency keys.
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
