# The public routes, shared by the local stack's port 8080 and production's port 443.

# Live seat maps (ADR 0013). Unbuffered, so each event goes out as soon as it arrives. The API
# sends a heartbeat every 15 s, well inside the 60 s read timeout; a replica that goes quiet
# for longer than that is treated as gone and the browser reconnects to another one.
location ~ ^/api/v1/shows/[^/]+/seats/events$ {
  proxy_pass http://api;
  # A replica that is shutting down answers 503 before the stream starts; opening a stream
  # changes nothing, so it is safe to try another replica at once (the replica drill).
  proxy_next_upstream error timeout http_503;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 60s;
  gzip off;
}

location /api/ {
  proxy_pass http://api;
}

location /webhooks/ {
  proxy_pass http://api;
}

location / {
  proxy_pass http://web;
}
