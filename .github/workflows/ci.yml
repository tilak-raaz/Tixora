name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

      - name: Production config (compose file, HTTPS nginx)
        run: make deploy-check

      - name: Unit tests
        run: npm run test:unit

      # Testcontainers uses the Docker daemon that GitHub's Ubuntu runners provide.
      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgres://bmt:bmt@localhost:5432/bmt
      REDIS_URL: redis://localhost:6379
      # Only for the migrate and seed scripts, which load the API's config.
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start Postgres and Redis
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres redis

      - name: Migrate and seed
        run: |
          npm run migrate
          npm run seed

      - name: Install Chromium
        run: npm exec -w @bmt/web -- playwright install --with-deps chromium

      - name: Playwright
        run: npm run e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  stack:
    name: Full stack (images, nginx, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only for Playwright on the runner; the app itself runs from the images built below.
      - run: npm ci

      - name: Build the images and start the stack
        run: RATE_LIMIT_ENABLED=false make stack DEMO=1

      - name: Seed
        run: make stack-seed DEMO=1

      - name: Install Chromium
        run: npm exec -w @bmt/web -- playwright install --with-deps chromium

      # Healthy is not the same as answering at normal speed right after a build (docs/lessons.md).
      - name: Wait for the stack to answer normally
        run: make stack-warm

      - name: Playwright through nginx
        run: E2E_BASE_URL=http://localhost:8080 npm run e2e

      - name: Container logs
        if: failure()
        run: |
          compose="docker compose -f infra/docker-compose.yml -f infra/docker-compose.demo.yml --profile full"
          $compose ps -a
          $compose logs --no-color --tail 200 migrate api worker web nginx

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stack
          path: apps/web/playwright-report
          retention-days: 7
