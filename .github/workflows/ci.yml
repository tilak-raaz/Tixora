name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

      - name: Unit tests
        run: npm run test:unit

      # Testcontainers uses the Docker daemon that GitHub's Ubuntu runners provide.
      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgres://bmt:bmt@localhost:5432/bmt
      REDIS_URL: redis://localhost:6379
      # Only for the migrate and seed scripts, which load the API's config.
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start Postgres and Redis
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres redis

      - name: Migrate and seed
        run: |
          npm run migrate
          npm run seed

      - name: Install Chromium
        run: npm exec -w @bmt/web -- playwright install --with-deps chromium

      - name: Playwright
        run: npm run e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
